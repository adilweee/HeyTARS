<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeyT.A.R.S Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        :root {
            --bg: #070b10;
            --panel: #0d131b;
            --panel-2: #111a24;
            --line: #233241;
            --text: #e6f7ff;
            --muted: #8aa2b4;
            --accent: #57e7ff;
            --green: #19ffb7;
            --red: #ff5c7a;
        }

        body {
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr) 300px;
        }

        .sidebar,
        .inspector {
            background: var(--panel);
            border-right: 1px solid var(--line);
            padding: 16px;
            overflow: auto;
        }

        .inspector {
            border-right: none;
            border-left: 1px solid var(--line);
        }

        .brand {
            font-size: 22px;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 14px;
        }

        button {
            border: 1px solid var(--line);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--accent);
        }

        .new-chat {
            width: 100%;
            margin-bottom: 16px;
        }

        .chat-list {
            display: grid;
            gap: 8px;
        }

        .chat-item {
            width: 100%;
            text-align: left;
            color: var(--muted);
        }

        .chat-item.active {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(87, 231, 255, 0.08);
        }

        .main {
            min-width: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background:
                linear-gradient(rgba(87, 231, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(87, 231, 255, 0.025) 1px, transparent 1px),
                #070b10;
            background-size: 32px 32px;
        }

        .topbar {
            border-bottom: 1px solid var(--line);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 19, 27, 0.8);
        }

        .status {
            color: var(--muted);
            font-size: 13px;
        }

        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            margin-right: 8px;
        }

        .messages {
            overflow: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            line-height: 1.5;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: rgba(17, 26, 36, 0.92);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(87, 231, 255, 0.08);
            border-color: rgba(87, 231, 255, 0.3);
        }

        .message.assistant {
            align-self: flex-start;
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 16px 18px;
            background: rgba(13, 19, 27, 0.92);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        textarea {
            width: 100%;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            border: 1px solid var(--line);
            background: #070b10;
            color: var(--text);
            border-radius: 8px;
            padding: 13px 14px;
            outline: none;
            font-size: 15px;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .send {
            min-width: 80px;
            border-color: rgba(87, 231, 255, 0.4);
        }

        .section-title {
            color: var(--text);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 18px 0 10px;
        }

        .info-card {
            border: 1px solid var(--line);
            background: var(--panel-2);
            border-radius: 8px;
            padding: 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .info-card strong {
            display: block;
            color: var(--text);
            margin-bottom: 4px;
        }

        .quick-list {
            display: grid;
            gap: 8px;
        }

        .quick-list button {
            width: 100%;
            text-align: left;
            color: var(--muted);
        }

        /* Responsive Kuralları */
        @media (max-width: 1200px) {
            .app {
                grid-template-columns: 240px minmax(0, 1fr) 250px;
            }
        }

        @media (max-width: 1024px) {
            .app {
                grid-template-columns: 240px minmax(0, 1fr);
            }

            .inspector {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .messages {
                padding: 16px;
            }

            .message {
                max-width: 90%;
                font-size: 14px;
            }

            .topbar {
                padding: 12px 16px;
            }

            .composer {
                padding: 12px;
            }

            textarea {
                font-size: 14px;
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <aside class="sidebar">
            <div class="brand">HeyT.A.R.S</div>
            <button class="new-chat" onclick="newChat()">Yeni Sohbet</button>
            <div class="section-title">Sohbetler</div>
            <div class="chat-list" id="chatList"></div>
        </aside>

        <section class="main">
            <header class="topbar">
                <div>
                    <strong id="chatTitle">Yeni Sohbet</strong>
                    <div class="status"><span class="status-dot"></span><span id="statusText">Yerel AI hazır</span>
                    </div>
                </div>
                <button onclick="clearCurrentChat()">Sohbeti Temizle</button>
            </header>

            <div class="messages" id="messages"></div>

            <form class="composer" onsubmit="sendMessage(event)">
                <textarea id="input" placeholder="TARS'a mesaj yaz..." onkeydown="handleKey(event)"></textarea>
                <button class="send" type="submit">Gönder</button>
            </form>
        </section>

        <aside class="inspector">
            <div class="section-title">TARS Kontrol</div>

            <div class="info-card">
                <strong>Model</strong>
                <span id="modelText">Gemini 2.5 Flash</span>
            </div>

            <div class="info-card">
                <strong>Durum</strong>
                <span id="aiStatus">Hazır</span>
            </div>

            <div class="info-card">
                <strong>Hafıza</strong>
                <span id="memoryText">Kalıcı hafıza devrede.</span>
            </div>

            <div class="section-title">Hızlı Komutlar</div>
            <div class="quick-list">
                <button onclick="usePrompt('Kısaca kendini tanıt.')">Kendini tanıt</button>
                <button onclick="usePrompt('Bana bugün için kısa bir çalışma planı çıkar.')">Çalışma planı</button>
                <button onclick="usePrompt('Şunu hatırla: Ben kısa cevapları severim.')">Hafıza komutu</button>
                <button onclick="usePrompt('Bu fikri geliştir: ')">Fikir geliştir</button>
            </div>
        </aside>
    </main>

    <script>
        const chatList = document.getElementById("chatList");
        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const chatTitle = document.getElementById("chatTitle");
        const statusText = document.getElementById("statusText");
        const aiStatus = document.getElementById("aiStatus");

        let chats = JSON.parse(localStorage.getItem("tars_chat_chats") || "[]");
        let activeChatId = localStorage.getItem("tars_chat_active");

        if (!chats.length) {
            chats = [createChat("Yeni Sohbet")];
            activeChatId = chats[0].id;
            save();
        }

        if (!activeChatId || !chats.find(chat => chat.id === activeChatId)) {
            activeChatId = chats[0].id;
        }

        render();

        function createChat(title) {
            return {
                id: String(Date.now()),
                title,
                messages: [
                    {
                        role: "assistant",
                        content: "Merhaba. Ben HeyT.A.R.S. Yazışmalı mod aktif. Sesli gösterişi şimdilik rafa kaldırdım."
                    }
                ],
                createdAt: new Date().toISOString()
            };
        }

        function getActiveChat() {
            return chats.find(chat => chat.id === activeChatId);
        }

        function save() {
            localStorage.setItem("tars_chat_chats", JSON.stringify(chats));
            localStorage.setItem("tars_chat_active", activeChatId);
        }

        function render() {
            renderChatList();
            renderMessages();
        }

        function renderChatList() {
            chatList.innerHTML = "";

            chats.forEach(chat => {
                const button = document.createElement("button");
                button.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
                button.textContent = chat.title;
                button.onclick = () => {
                    activeChatId = chat.id;
                    save();
                    render();
                };
                chatList.appendChild(button);
            });
        }

        function renderMessages() {
            const chat = getActiveChat();
            chatTitle.textContent = chat.title;
            messages.innerHTML = "";

            chat.messages.forEach(message => {
                const div = document.createElement("div");
                div.className = "message " + (message.role === "user" ? "user" : "assistant");
                div.textContent = message.content;
                messages.appendChild(div);
            });

            messages.scrollTop = messages.scrollHeight;
        }

        function newChat() {
            const chat = createChat("Yeni Sohbet " + (chats.length + 1));
            chats.unshift(chat);
            activeChatId = chat.id;
            save();
            render();
        }

        function clearCurrentChat() {
            const chat = getActiveChat();
            chat.messages = [
                {
                    role: "assistant",
                    content: "Sohbet temizlendi. Hafızam etkilenmedi, sadece masa toplandı."
                }
            ];
            save();
            render();
        }

        function handleKey(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage(event);
            }
        }

        function usePrompt(text) {
            input.value = text;
            input.focus();
        }

        async function sendMessage(event) {
            event.preventDefault();

            const text = input.value.trim();
            if (!text) return;

            const chat = getActiveChat();

            chat.messages.push({ role: "user", content: text });

            if (chat.title.startsWith("Yeni Sohbet")) {
                chat.title = text.slice(0, 28) || "Sohbet";
            }

            input.value = "";
            save();
            render();

            setStatus("Düşünüyor");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text,
                        personality: {
                            humor: 65,
                            honesty: 90,
                            formality: 40,
                            sarcasm: 55,
                            patience: 75
                        }
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "AI bağlantı hatası.");
                }

                chat.messages.push({
                    role: "assistant",
                    content: data.answer || "Cevap üretemedim."
                });

                if (data.model) {
                    document.getElementById("modelText").textContent = data.model;
                }

                setStatus("Hazır");
            } catch (error) {
                chat.messages.push({
                    role: "assistant",
                    content: "Bağlantı hatası: " + error.message + "\n\nNot: Bu dosyayı tek başına açtıysan gerçek AI çalışmaz. Sonra server.js bağlayacağız."
                });

                setStatus("Hata");
            }

            save();
            render();
        }

        function setStatus(text) {
            statusText.textContent = text;
            aiStatus.textContent = text;
        }
    </script>
</body>

</html>
